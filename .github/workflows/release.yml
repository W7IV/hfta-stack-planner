# Builds the distributable versions when a tag v* is pushed (or by hand): the Windows package (zip) and the Docker
# image (ghcr.io/<owner>/hfta-stack-planner), then attaches the zip to a GitHub release.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tools (MinGW gfortran, Wine, zip)
        run: |
          sudo apt-get update -q
          # "wine" (not only "wine64"): the wine64 package alone does not install the `wine` and `winepath` commands
          sudo apt-get install -y -q gfortran-mingw-w64-x86-64 gcc-mingw-w64-x86-64 automake autoconf wine wine64 zip python3-pip
          wine --version
      - name: Build the Windows package
        shell: bash   # the explicit bash shell sets pipefail, so a failed build is not hidden by tee
        run: tools/build_windows.sh dist 2>&1 | tee build.log
      - name: Report a failed build (last lines of the log as a commit comment)
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo '```'; tail -c 5000 build.log | sed 's/\x1b\[[0-9;?]*[a-zA-Z]//g'; echo '```'; } > body.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@body.md >/dev/null && echo "posted" || cat body.md
      - uses: actions/upload-artifact@v4
        with: { name: windows-package, path: dist/*.zip, if-no-files-found: error }
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hfta-stack-planner
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: RAILWAY_GIT_COMMIT_SHA=${{ github.sha }}
  release:
    needs: [windows, docker]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { name: windows-package, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: |
            **Windows:** download the zip, unzip, double-click "Start HFTA Stack Planner.exe". No installation or batch scripts. If Windows Smart App Control blocks the unsigned executable, use Docker and report the warning.
            **macOS / Linux / Windows with Docker:** `docker run -p 127.0.0.1:5055:5055 -v hfta-data:/data ghcr.io/w7iv/hfta-stack-planner:${{ github.ref_name }}` then open http://localhost:5055
            Getting started: open Help in the planner, or /guide.
