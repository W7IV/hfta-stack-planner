name: voacap-batch-tests
on:
  pull_request:
    paths:
      - "v2.py"
      - "core/aoa_gen.py"
      - "static/v2.js"
      - "tests/test_voacap_batch.py"
      - ".github/workflows/voacap-batch-tests.yml"
permissions:
  contents: read
jobs:
  voacap-batch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --check static/v2.js
      - run: python -m pip install -r requirements.txt
      - name: Build pinned OpenHFTA for application imports
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gfortran make
          git clone https://github.com/RioDXGroup/openhfta.git ../openhfta
          git -C ../openhfta checkout 7d62e863f1d27372c97df3ac6ef53092fb58bd50
          make -C ../openhfta all
      - run: python tests/test_voacap_batch.py
